[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dicedist"
version = "0.1.0"
description = "Exact probability statistics for dice notation expressions"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
dicedist = "dicedist.cli:main"

[tool.setuptools.packages.find]
include = ["dicedist*"]
